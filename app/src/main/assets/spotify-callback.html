<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenOS Spotify</title><style>body{font:17px system-ui;background:#0a1020;color:#fff;padding:24px;max-width:650px;margin:auto}code{display:block;overflow-wrap:anywhere;background:#1b2942;padding:16px;border-radius:12px;margin:12px 0}button{padding:13px;border:0;border-radius:10px;font-weight:bold}</style></head><body><h1>Spotify-Autorisierung</h1><p>Kopiere den Code und den State und füge beides auf der ScreenOS-Handyseite ein.</p><h3>Code</h3><code id="code">Kein Code erhalten.</code><button onclick="copy('code')">Code kopieren</button><h3>State</h3><code id="state"></code><button onclick="copy('state')">State kopieren</button><p id="error"></p><script>const p=new URLSearchParams(location.search);document.getElementById('code').textContent=p.get('code')||'Kein Code erhalten';document.getElementById('state').textContent=p.get('state')||'';document.getElementById('error').textContent=p.get('error')?'Spotify-Fehler: '+p.get('error'):'';function copy(id){const t=document.getElementById(id).textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);}</script></body></html>
